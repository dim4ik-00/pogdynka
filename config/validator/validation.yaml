App\Entity\Location:
    properties:
        city:
            - NotBlank:
                  groups: [create, edit]
        country:
            - NotBlank:
                  groups: [create, edit]
            - Length:
                  min: 2
                  max: 2
                  groups: [create, edit]
        latitude:
            - NotBlank:
                  groups: [create, edit]
            - Range:
                  min: -90
                  max: 90
                  notInRangeMessage: 'This value should be between {{ min }} and {{ max }}.'
                  groups: [create, edit]
        longitude:
            - NotBlank:
                  groups: [create, edit]
            - Range:
                  min: -180
                  max: 180
                  notInRangeMessage: 'This value should be between {{ min }} and {{ max }}.'
                  groups: [create, edit]

App\Entity\Measurement:
    properties:
        celsius:
            - NotBlank:
                  groups: [create, edit]
            - Range:
                  min: -60
                  max: 60
                  notInRangeMessage: 'Wartość powinna być między {{ min }} a {{ max }}.'
                  groups: [create, edit]
        date:
            - NotBlank:
                  groups: [create, edit]
        location:
            - NotBlank:
                  groups: [create, edit]
